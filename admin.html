<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVSK Portal — Admin Console</title>
<style>
:root{--p:#2563eb;--muted:#64748b;--red:#dc2626}
*{box-sizing:border-box}body{font-family:system-ui,Segoe UI,Roboto,Arial;background:#f1f5f9;margin:0;color:#0f172a}
header{background:#0f172a;color:#fff}
.wrap{max-width:1200px;margin:auto;padding:16px}
.nav{height:64px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800}
.btn{background:var(--p);color:#fff;padding:8px 12px;border-radius:8px;border:0;cursor:pointer}
.btn.gray{background:#eef2ff;color:#0f172a}
.layout{display:grid;grid-template-columns:360px 1fr;gap:16px;margin-top:18px}
.card{background:#fff;border-radius:12px;padding:12px;border:1px solid #e6eefb}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:8px;border-bottom:1px solid #eef6ff;text-align:left}
.small{color:var(--muted)}
.scroll{overflow:auto}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
  <header>
    <div class="wrap nav"><div class="brand">AVSK Admin Console</div><div><button id="toHome" class="btn gray">Home</button> <button id="logout" class="btn" style="margin-left:8px;background:#ef4444">Logout</button></div></div>
  </header>

  <main class="wrap">
    <div class="layout">
      <section class="card">
        <h3 id="prodTitle">Add product</h3>
        <label>Product name</label>
        <input id="p_name" />
        <label style="margin-top:8px">Commission amount (₹)</label>
        <input id="p_comm" type="number" min="0" step="0.01" />
        <label style="margin-top:8px">Commission display text</label>
        <input id="p_label" />
        <label style="margin-top:8px">Target URL (https://)</label>
        <input id="p_url" />
        <div style="margin-top:12px;display:flex;gap:8px">
          <button id="saveProd" class="btn">Save</button>
          <button id="clearProd" class="btn gray">Clear</button>
        </div>
        <div id="prodMsg" class="small" style="margin-top:8px"></div>
      </section>

      <section class="card">
        <h3>Products</h3>
        <div class="scroll" style="max-height:320px;overflow:auto;margin-top:8px">
          <table class="table"><thead><tr><th>Product</th><th>Commission</th><th>URL</th><th>Actions</th></tr></thead><tbody id="products"></tbody></table>
        </div>
      </section>
    </div>

    <div class="card" style="margin-top:12px">
      <h3>Partners & KYC</h3>
      <p class="small">Manage partner profiles, verify KYC and adjust wallets.</p>
      <div style="margin-top:8px" class="scroll"><table class="table"><thead><tr><th>Email</th><th>Balance</th><th>KYC</th><th>Actions</th></tr></thead><tbody id="users"></tbody></table></div>
    </div>

    <div class="card" style="margin-top:12px">
      <h3>Wallet operation</h3>
      <label>Partner email</label>
      <input id="w_email" />
      <label style="margin-top:8px">Amount (₹)</label>
      <input id="w_amount" type="number" />
      <label style="margin-top:8px">Operation</label>
      <select id="w_op"><option value="credit">Credit</option><option value="bonus">Bonus</option><option value="debit">Debit</option></select>
      <div style="margin-top:10px"><button id="applyWallet" class="btn">Apply</button></div>
      <div id="walletMsg" class="small" style="margin-top:8px"></div>
    </div>

  </main>

<script>
const USERS_KEY='avsk_users', SESSION_KEY='avsk_session', PRODUCTS_KEY='avsk_products';
const $=s=>document.querySelector(s);
function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2})}
function esc(s){return String(s||'')}

// protect admin
const session = read(SESSION_KEY, null); const users = read(USERS_KEY, {});
if(!session || !users[session.email] || users[session.email].role !== 'admin'){ location.replace('auth.html'); throw new Error('not-authorized'); }
const admin = users[session.email];

let editProdId = null;

function renderProducts(){ const ps = read(PRODUCTS_KEY, []); $('#products').innerHTML = ps.length? ps.map(p=>`<tr data-id="${esc(p.id)}"><td>${esc(p.name)}</td><td>${esc(p.commissionLabel||money(p.commission))}</td><td><a href="${esc(p.url)}" target="_blank">Open</a></td><td><button class="btn gray" data-edit="${esc(p.id)}">Edit</button> <button class="btn" data-delete="${esc(p.id)}" style="background:#ef4444">Delete</button></td></tr>`).join('') : '<tr><td colspan="4" class="small">No products</td></tr>'; }

function renderUsers(){ const us = read(USERS_KEY, {}); const partners = Object.values(us).filter(u=>u.role==='partner'); $('#users').innerHTML = partners.length ? partners.map(u=>`<tr data-email="${esc(u.email)}"><td>${esc(u.email)}</td><td>${money(u.balance)}</td><td>${u.kyc&&u.kyc.verified?'<strong style="color:green">Verified</strong>':'<span style="color:#b45309">'+esc(u.kyc?.status||'not submitted')+'</span>'}</td><td><button class="btn" data-view="${esc(u.email)}">View</button> <button class="btn" data-verify="${esc(u.email)}">Verify</button> <button class="btn gray" data-reject="${esc(u.email)}">Reject</button></td></tr>`).join('') : '<tr><td colspan="4" class="small">No partners</td></tr>'; }

// product actions
$('#products').addEventListener('click', (e)=>{ const tr = e.target.closest('tr'); if(!tr) return; const id = tr.dataset.id; if(e.target.dataset.edit){ const ps = read(PRODUCTS_KEY, []); const p = ps.find(x=>x.id===id); if(p){ editProdId = id; $('#prodTitle').textContent='Edit product'; $('#p_name').value=p.name; $('#p_comm').value=p.commission; $('#p_label').value=p.commissionLabel||''; $('#p_url').value=p.url; } } else if(e.target.dataset.delete){ if(!confirm('Delete product?')) return; const ps = read(PRODUCTS_KEY, []).filter(x=>x.id!==id); save(PRODUCTS_KEY, ps); renderProducts(); } });

$('#saveProd').addEventListener('click', ()=>{ const name = $('#p_name').value.trim(); const commission = Number($('#p_comm').value); const label = $('#p_label').value.trim(); const url = $('#p_url').value.trim(); if(!name || !Number.isFinite(commission) || commission < 0 || !/^https?:\/\//i.test(url)){ $('#prodMsg').textContent = 'Enter valid details and http(s) URL.'; return; } const ps = read(PRODUCTS_KEY, []); const id = editProdId || crypto.randomUUID(); const p = { id, name, commission, commissionLabel: label || money(commission), url, updatedAt: Date.now() }; const next = editProdId ? ps.map(x=>x.id===id?p:x) : [...ps,p]; save(PRODUCTS_KEY, next); $('#prodMsg').textContent='Saved.'; editProdId = null; $('#prodTitle').textContent='Add product'; $('#p_name').value=''; $('#p_comm').value=''; $('#p_label').value=''; $('#p_url').value=''; renderProducts(); });

$('#clearProd').addEventListener('click', ()=>{ editProdId=null; $('#prodTitle').textContent='Add product'; $('#p_name').value=''; $('#p_comm').value=''; $('#p_label').value=''; $('#p_url').value=''; $('#prodMsg').textContent=''; });

// users table actions
$('#users').addEventListener('click', (e)=>{ const email = e.target.dataset.view||e.target.dataset.verify||e.target.dataset.reject; if(!email) return; const us = read(USERS_KEY, {}); const u = us[email]; if(e.target.dataset.view){ // show details
  let details = `User: ${u.email}\nName: ${u.name}\nBalance: ${u.balance}\nUPI: ${u.profile?.upi || ''}\nBank: ${u.profile?.bankName || ''} (${u.profile?.ifsc || ''})\nAccount(last4): ${u.profile?.bankAccount?('****'+String(u.profile.bankAccount).slice(-4)) : ''}\nKYC status: ${u.kyc?.status||'n/a'}`;
  if(u.kyc && u.kyc.documents){ details += '\n\nKYC documents available (open in new tab if needed).'; }
  alert(details);
 } else if(e.target.dataset.verify){ u.kyc = u.kyc || {}; u.kyc.verified = true; u.kyc.status = 'verified'; u.kyc.verifiedBy = admin.email; u.kyc.verifiedAt = Date.now(); us[email] = u; save(USERS_KEY, us); renderUsers(); alert('KYC verified for '+email); } else if(e.target.dataset.reject){ u.kyc = u.kyc || {}; u.kyc.verified = false; u.kyc.status = 'rejected'; u.kyc.reviewedAt = Date.now(); us[email] = u; save(USERS_KEY, us); renderUsers(); alert('KYC rejected for '+email); } });

// wallet apply
$('#applyWallet').addEventListener('click', ()=>{ const email = $('#w_email').value.trim().toLowerCase(); const amt = Number($('#w_amount').value); const op = $('#w_op').value; const us = read(USERS_KEY, {}); const u = us[email]; if(!u || u.role !== 'partner' || !amt || amt <= 0){ $('#walletMsg').textContent = 'Enter existing partner and positive amount.'; return; } if(op === 'debit' && u.balance < amt){ $('#walletMsg').textContent = 'Insufficient balance for debit.'; return; } const signed = op === 'debit' ? -amt : amt; u.balance = Number((u.balance + signed).toFixed(2)); u.transactions = u.transactions || []; u.transactions.push({ date: Date.now(), amount: signed, description: op === 'bonus' ? 'Admin bonus' : op === 'debit' ? 'Admin debit' : 'Admin credit' }); us[email] = u; save(USERS_KEY, us); $('#walletMsg').textContent = 'Wallet updated.'; renderUsers(); });

// nav
$('#logout').addEventListener('click', ()=>{ localStorage.removeItem(SESSION_KEY); location.href='auth.html'; }); $('#toHome').addEventListener('click', ()=>{ location.href='auth.html'; });

renderProducts(); renderUsers(); window.addEventListener('storage', (e)=>{ if([USERS_KEY, PRODUCTS_KEY].includes(e.key)) { renderProducts(); renderUsers(); } });
</script>
</body>
</html>
