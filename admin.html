<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVSK | Admin console</title><style>
:root{--p:#2563eb;--ink:#0f172a;--muted:#64748b;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:var(--ink);font:14px system-ui,sans-serif}header{background:#0f172a;color:#fff}.wrap{max-width:1200px;margin:auto;padding:0 20px}.nav{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:800}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--p);color:#fff;font-weight:700;cursor:pointer}.btn.red{background:var(--red)}.btn.gray{background:#e2e8f0;color:var(--ink)}main{padding:30px 20px}.layout{display:grid;grid-template-columns:350px 1fr;gap:20px}.card{background:#fff;border-radius:15px;border:1px solid #e2e8f0;padding:22px;box-shadow:0 4px 16px #0f172a08}h2,h3{margin-top:0}label{display:block;font-weight:700;margin:13px 0 5px}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:17px}.msg{margin-top:12px;color:#15803d}.scroll{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px 7px;border-bottom:1px solid #e2e8f0;white-space:nowrap}.small{color:var(--muted);font-size:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap nav"><div class="brand">AVSK Admin Console</div><div><a class="btn gray" href="index.html">Home</a> <button class="btn" id="logout">Logout</button></div></div></header><main class="wrap"><div class="layout"><section class="card"><h2 id="title">Add product</h2><label>Product name</label><input id="name" placeholder="e.g. Business Loan"><label>Commission amount (₹)</label><input id="commission" type="number" min="0" step="0.01"><label>Commission display text</label><input id="label" placeholder="₹2,500 per approved lead"><label>Target URL</label><input id="url" type="url" placeholder="https://example.com/apply"><div class="actions"><button class="btn" id="save">Publish product</button><button class="btn gray" id="clear">Clear</button></div><div class="msg" id="msg"></div></section><section class="card"><h2>Products</h2><div class="scroll"><table class="table"><thead><tr><th>Product</th><th>Commission</th><th>URL</th><th>Actions</th></tr></thead><tbody id="products"></tbody></table></div></section></div><section class="card" style="margin-top:20px"><h2>Partner wallet operations</h2><p class="small">All credits and debits create an auditable transaction. Never share admin credentials.</p><div class="layout" style="grid-template-columns:1fr 1fr"><div><label>Partner email</label><input id="email" type="email"><label>Amount (₹)</label><input id="amount" type="number" min="0.01" step="0.01"><label>Operation</label><select id="operation"><option value="credit">Credit commission</option><option value="bonus">Credit bonus</option><option value="debit">Debit adjustment</option></select><button class="btn" id="wallet" style="margin-top:16px">Apply wallet entry</button><div class="msg" id="walletMsg"></div></div><div class="scroll"><table class="table"><thead><tr><th>Partner</th><th>Balance</th><th>Leads</th></tr></thead><tbody id="users"></tbody></table></div></div></section></main><script>
const U='avsk_users',S='avsk_session',P='avsk_products';const $=x=>document.querySelector(x);function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2})}function check(){let s=read(S,null),u=s&&read(U,{})[s.email];if(!s||!u||u.role!=='admin'){location.replace('auth.html');return null}return u}let admin=check(),edit=null;if(admin){function render(){let ps=read(P,[]);$('#products').innerHTML=ps.length?ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.commissionLabel||money(p.commission))}</td><td><a href="${esc(p.url)}" target="_blank" rel="noopener">Open</a></td><td><button class="btn gray" data-edit="${esc(p.id)}">Edit</button> <button class="btn red" data-delete="${esc(p.id)}">Delete</button></td></tr>`).join(''):'<tr><td colspan="4" class="small">No products yet.</td></tr>';let us=read(U,{});$('#users').innerHTML=Object.values(us).filter(x=>x.role==='partner').map(x=>`<tr><td>${esc(x.email)}</td><td>${money(x.balance)}</td><td>${x.leads||0}</td></tr>`).join('')||'<tr><td colspan="3" class="small">No partners yet.</td></tr>'}function clear(){edit=null;$('#title').textContent='Add product';$('#save').textContent='Publish product';['name','commission','label','url'].forEach(x=>$('#'+x).value='')}$('#products').onclick=e=>{let id=e.target.dataset.edit||e.target.dataset.delete;if(!id)return;let ps=read(P,[]),p=ps.find(x=>x.id===id);if(e.target.dataset.edit){edit=id;$('#title').textContent='Edit product';$('#save').textContent='Update product';$('#name').value=p.name;$('#commission').value=p.commission||0;$('#label').value=p.commissionLabel||'';$('#url').value=p.url}else if(confirm('Delete this product?')){save(P,ps.filter(x=>x.id!==id));render()}};$('#save').onclick=()=>{let name=$('#name').value.trim(),commission=Number($('#commission').value),label=$('#label').value.trim(),url=$('#url').value.trim();if(!name||!Number.isFinite(commission)||commission<0||!/^https?:\/\//i.test(url))return $('#msg').textContent='Enter a name, valid commission and http(s) URL.';let ps=read(P,[]),p={id:edit||crypto.randomUUID(),name,commission,commissionLabel:label||money(commission),url,updatedAt:Date.now()};save(P,edit?ps.map(x=>x.id===edit?p:x):[...ps,p]);$('#msg').textContent='Product saved and published.';clear();render()};$('#clear').onclick=clear;$('#wallet').onclick=()=>{let email=$('#email').value.trim().toLowerCase(),amt=Number($('#amount').value),op=$('#operation').value,us=read(U,{}),u=us[email];if(!u||u.role!=='partner'||!amt||amt<=0)return $('#walletMsg').textContent='Enter an existing partner and positive amount.';if(op==='debit'&&u.balance<amt)return $('#walletMsg').textContent='Debit exceeds wallet balance.';let signed=op==='debit'?-amt:amt;u.balance=Number((u.balance+signed).toFixed(2));u.transactions=u.transactions||[];u.transactions.push({date:Date.now(),amount:signed,description:op==='bonus'?'Admin bonus':op==='debit'?'Admin adjustment':'Commission credit'});us[email]=u;save(U,us);$('#walletMsg').textContent='Wallet updated successfully.';$('#amount').value='';render()};$('#logout').onclick=()=>{localStorage.removeItem(S);location.href='auth.html'};render();addEventListener('storage',e=>{if([U,P].includes(e.key))render()})}
</script></body></html>
