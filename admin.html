<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AVSK — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <!-- Admin password modal -->
  <div id="pwModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 w-full max-w-md shadow">
      <h2 class="text-xl font-semibold mb-2">Admin access</h2>
      <p class="text-sm text-slate-600 mb-4">Enter the admin password to open the admin console. This page is protected by a client-side password only and is intended for demo/admin use.</p>
      <input id="adminPw" type="password" class="w-full p-2 border rounded mb-3" placeholder="Admin password" />
      <div class="flex gap-2">
        <button id="pwSubmit" class="flex-1 bg-blue-600 text-white p-2 rounded">Unlock</button>
        <button id="pwCancel" class="flex-1 border p-2 rounded">Cancel</button>
      </div>
      <p id="pwMsg" class="text-sm text-red-600 mt-2 min-h-[1.25rem]"></p>
    </div>
  </div>

  <!-- Admin UI (hidden until unlocked) -->
  <div id="adminUI" class="hidden">
    <header class="bg-white border-b">
      <div class="max-w-6xl mx-auto flex items-center justify-between p-4">
        <div class="text-xl font-bold">AVSK Admin Console</div>
        <div class="flex items-center gap-3">
          <a href="auth.html" class="px-3 py-2 rounded border text-sm">Home</a>
          <button id="logout" class="px-3 py-2 rounded bg-red-500 text-white text-sm">Clear Admin Unlock</button>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto p-4">
      <div class="grid md:grid-cols-2 gap-4">
        <section class="bg-white p-4 rounded shadow">
          <h3 class="font-semibold">Add / Edit product</h3>
          <label class="text-xs mt-2">Name</label>
          <input id="prodName" class="w-full p-2 border rounded" />
          <label class="text-xs mt-2">Commission (numeric)</label>
          <input id="prodCommission" type="number" class="w-full p-2 border rounded" />
          <label class="text-xs mt-2">Commission label (optional)</label>
          <input id="prodLabel" class="w-full p-2 border rounded" />
          <label class="text-xs mt-2">Target URL</label>
          <input id="prodUrl" class="w-full p-2 border rounded" placeholder="https://..." />
          <div class="flex gap-2 mt-3">
            <button id="saveProd" class="px-3 py-2 bg-blue-600 text-white rounded">Save</button>
            <button id="clearProd" class="px-3 py-2 border rounded">Clear</button>
          </div>
          <p id="prodMsg" class="text-sm text-green-600 mt-2"></p>
        </section>

        <section class="bg-white p-4 rounded shadow">
          <h3 class="font-semibold">Partners & KYC</h3>
          <div class="mt-3 overflow-auto" style="max-height:260px">
            <table class="w-full text-sm">
              <thead class="text-slate-500 text-left"><tr><th>Email</th><th>Balance</th><th>KYC</th><th>Actions</th></tr></thead>
              <tbody id="usersTable" class="divide-y"></tbody>
            </table>
          </div>
        </section>
      </div>

      <section class="bg-white p-4 rounded shadow mt-4">
        <h3 class="font-semibold">All products</h3>
        <div class="mt-3 overflow-auto" style="max-height:260px">
          <table class="w-full text-sm">
            <thead class="text-slate-500 text-left"><tr><th>Name</th><th>Commission</th><th>URL</th><th>Actions</th></tr></thead>
            <tbody id="productsTable" class="divide-y"></tbody>
          </table>
        </div>
      </section>

      <section class="bg-white p-4 rounded shadow mt-4">
        <h3 class="font-semibold">Wallet operation</h3>
        <div class="grid md:grid-cols-3 gap-2 mt-2">
          <input id="w_email" placeholder="partner email" class="p-2 border rounded" />
          <input id="w_amount" placeholder="amount" type="number" class="p-2 border rounded" />
          <select id="w_op" class="p-2 border rounded">
            <option value="credit">Credit</option>
            <option value="bonus">Bonus</option>
            <option value="debit">Debit</option>
          </select>
        </div>
        <div class="mt-3">
          <button id="applyWallet" class="px-4 py-2 bg-blue-600 text-white rounded">Apply</button>
          <span id="walletMsg" class="text-sm text-green-600 ml-3"></span>
        </div>
      </section>
    </main>
  </div>

<script>
/*
Admin access control (frontend-only).
- This page is now standalone: it does NOT redirect to auth.html.
- On load, modal asks for admin password "Rishu@123". On correct entry the admin UI is shown.
- Cancel simply clears the password field and keeps the modal visible (no redirect).
- Warning: client-side-only protection. For production, use server-side auth.
*/
const ADMIN_PASSWORD = 'Rishu@123';
const USERS_KEY = 'avsk_users';
const PRODUCTS_KEY = 'avsk_products';

const $ = s => document.querySelector(s);
function read(k,d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }

// If unlocked in this tab, show UI
if(sessionStorage.getItem('avsk_admin_unlocked') === 'true'){
  $('#pwModal').style.display = 'none';
  initAdminUI();
}

$('#pwSubmit').addEventListener('click', ()=>{
  const v = ($('#adminPw').value || '').trim();
  if(v === ADMIN_PASSWORD){
    sessionStorage.setItem('avsk_admin_unlocked', 'true');
    $('#pwModal').style.display = 'none';
    initAdminUI();
  } else {
    $('#pwMsg').textContent = 'Incorrect password.';
    setTimeout(()=>{ $('#pwMsg').textContent = ''; }, 3000);
  }
});
$('#pwCancel').addEventListener('click', ()=> {
  // Do not redirect anywhere; keep admin page separate. Just clear input.
  $('#adminPw').value = '';
  $('#pwMsg').textContent = 'Admin access cancelled. Page remains locked.';
  setTimeout(()=>$('#pwMsg').textContent = '', 2500);
});

function initAdminUI(){
  $('#adminUI').classList.remove('hidden');
  renderUsers();
  renderProducts();
}

// Product management
function idGen(){ return 'p-'+Math.random().toString(36).slice(2,9); }
$('#saveProd').addEventListener('click', ()=>{
  const name = $('#prodName').value.trim();
  const commission = Number($('#prodCommission').value);
  const label = $('#prodLabel').value.trim();
  const url = $('#prodUrl').value.trim();
  if(!name || !url || isNaN(commission) || commission < 0){ $('#prodMsg').textContent = 'Enter valid name, commission and URL.'; return; }
  const ps = read(PRODUCTS_KEY, []);
  const editId = $('#prodName').dataset.editId;
  const id = editId || idGen();
  const product = { id, name, commission, commissionLabel: label || ('₹'+Number(commission).toLocaleString()), url, updatedAt: Date.now() };
  let next;
  if(editId){ next = ps.map(p=>p.id===id?product:p); delete $('#prodName').dataset.editId; }
  else { next = ps.concat([product]); }
  save(PRODUCTS_KEY, next);
  // persist and notify other tabs/pages
  localStorage.setItem(PRODUCTS_KEY, JSON.stringify(next));
  $('#prodMsg').textContent = editId ? 'Product updated.' : 'Product added.';
  setTimeout(()=>$('#prodMsg').textContent = '', 2000);
  $('#prodName').value=''; $('#prodCommission').value=''; $('#prodLabel').value=''; $('#prodUrl').value='';
  renderProducts();
});

$('#clearProd').addEventListener('click', ()=>{ $('#prodName').value=''; $('#prodCommission').value=''; $('#prodLabel').value=''; $('#prodUrl').value=''; delete $('#prodName').dataset.editId; $('#prodMsg').textContent=''; });

function renderProducts(){
  const ps = read(PRODUCTS_KEY, []);
  const tbody = $('#productsTable');
  if(ps.length===0){ tbody.innerHTML = '<tr><td colspan="4" class="py-2 text-slate-500">No products</td></tr>'; return; }
  tbody.innerHTML = ps.map(p=>`<tr>
    <td class="py-2">${escapeHtml(p.name)}</td>
    <td class="py-2">${escapeHtml(p.commissionLabel || p.commission)}</td>
    <td class="py-2"><a class="text-blue-600" href="${escapeAttr(p.url)}" target="_blank">Open</a></td>
    <td class="py-2">
      <button class="px-2 py-1 bg-slate-200 rounded" data-edit="${p.id}">Edit</button>
      <button class="px-2 py-1 bg-red-600 text-white rounded" data-delete="${p.id}">Delete</button>
    </td>
  </tr>`).join('');
}

// product edit/delete handlers
$('#productsTable').addEventListener('click', (e)=>{
  const id = e.target.dataset.edit || e.target.dataset.delete;
  if(!id) return;
  const ps = read(PRODUCTS_KEY, []);
  const product = ps.find(x=>x.id===id);
  if(e.target.dataset.edit){
    $('#prodName').value = product.name; $('#prodCommission').value = product.commission; $('#prodLabel').value = product.commissionLabel || '';
    $('#prodUrl').value = product.url; $('#prodName').dataset.editId = product.id;
    $('#prodMsg').textContent = 'Editing product.';
    return;
  }
  if(e.target.dataset.delete){
    if(!confirm('Delete product "'+product.name+'"? This cannot be undone.')) return;
    const next = ps.filter(p=>p.id!==id);
    save(PRODUCTS_KEY, next);
    localStorage.setItem(PRODUCTS_KEY, JSON.stringify(next));
    $('#prodMsg').textContent = 'Product deleted.';
    setTimeout(()=>$('#prodMsg').textContent = '', 2000);
    renderProducts();
  }
});

// Users & KYC
function renderUsers(){
  const users = read(USERS_KEY, {});
  const rows = Object.values(users).filter(u=>u.role === 'partner');
  const tbody = $('#usersTable');
  tbody.innerHTML = rows.length ? rows.map(u=>`
    <tr>
      <td class="py-2">${escapeHtml(u.email)}</td>
      <td class="py-2">₹${Number(u.balance||0).toFixed(2)}</td>
      <td class="py-2">${u.kyc?.verified ? '<span class="text-green-600 font-semibold">Verified</span>' : '<span class="text-amber-600">'+(u.kyc?.status||'not submitted')+'</span>'}</td>
      <td class="py-2">
        <button class="px-2 py-1 bg-slate-200 rounded" data-view="${u.email}">View</button>
        <button class="px-2 py-1 bg-green-600 text-white rounded" data-verify="${u.email}">Verify</button>
        <button class="px-2 py-1 bg-amber-300 rounded" data-reject="${u.email}">Reject</button>
      </td>
    </tr>
  `).join('') : '<tr><td colspan="4" class="py-2 text-slate-500">No partners</td></tr>';
}

$('#usersTable').addEventListener('click', (e)=>{
  const view = e.target.dataset.view, verify = e.target.dataset.verify, reject = e.target.dataset.reject;
  if(view){ const users = read(USERS_KEY, {}); const u = users[view]; alert(JSON.stringify(u, null, 2)); }
  if(verify){ const users = read(USERS_KEY, {}); if(!users[verify]) return; users[verify].kyc = users[verify].kyc || {}; users[verify].kyc.verified = true; users[verify].kyc.status = 'verified'; users[verify].kyc.verifiedAt = Date.now(); save(USERS_KEY, users); renderUsers(); alert('KYC verified'); }
  if(reject){ const users = read(USERS_KEY, {}); if(!users[reject]) return; users[reject].kyc = users[reject].kyc || {}; users[reject].kyc.verified = false; users[reject].kyc.status = 'rejected'; users[reject].kyc.reviewedAt = Date.now(); save(USERS_KEY, users); renderUsers(); alert('KYC rejected'); }
});

// Wallet ops
$('#applyWallet').addEventListener('click', ()=>{
  const email = $('#w_email').value.trim().toLowerCase();
  const amt = Number($('#w_amount').value);
  const op = $('#w_op').value;
  const users = read(USERS_KEY, {});
  if(!users[email]){ $('#walletMsg').textContent = 'Partner not found'; setTimeout(()=>$('#walletMsg').textContent='',3000); return; }
  if(!amt || amt <= 0){ $('#walletMsg').textContent = 'Enter positive amount'; setTimeout(()=>$('#walletMsg').textContent='',3000); return; }
  const signed = op === 'debit' ? -amt : amt;
  users[email].balance = Number(((users[email].balance || 0) + signed).toFixed(2));
  users[email].transactions = users[email].transactions || [];
  users[email].transactions.push({ date: Date.now(), amount: signed, description: op === 'bonus' ? 'Admin bonus' : op === 'debit' ? 'Admin debit' : 'Admin credit' });
  save(USERS_KEY, users);
  // notify other pages
  localStorage.setItem(USERS_KEY, JSON.stringify(users));
  $('#walletMsg').textContent = 'Wallet updated';
  setTimeout(()=>$('#walletMsg').textContent='',3000);
  renderUsers();
});

// logout/clear admin unlock
$('#logout').addEventListener('click', ()=>{ sessionStorage.removeItem('avsk_admin_unlocked'); alert('Admin unlock cleared for this tab. Refresh to re-open modal.'); $('#adminPw').value=''; $('#pwModal').style.display = 'block'; $('#adminUI').classList.add('hidden'); });

// storage listener to update lists if other tabs modify data
window.addEventListener('storage', (e)=>{ if([USERS_KEY, PRODUCTS_KEY].includes(e.key)) { renderUsers(); renderProducts(); } });

// small helpers
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[c]); }
function escapeAttr(s){ return (s||'').replace(/"/g,'\"'); }
</script>
</body>
</html>
