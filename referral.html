<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVSK — Referral capture</title>
<style>
:root{--p:#2563eb;--muted:#64748b}
*{box-sizing:border-box}body{font-family:system-ui,Segoe UI,Roboto,Arial;background:#f8fafc;margin:0;color:#0f172a}
.wrap{max-width:900px;margin:auto;padding:18px}
.card{background:#fff;border-radius:12px;padding:16px;border:1px solid #e6eefb}
.btn{background:var(--p);color:#fff;padding:8px 12px;border-radius:8px;border:0}
.field{margin-top:10px}
label{display:block;font-weight:700}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #dbeafe}
.small{color:var(--muted)}
</style>
</head>
<body>
  <main class="wrap">
    <div class="card" id="card">
      <h2 id="productName"></h2>
      <div class="small" id="productComm"></div>
      <p class="small">You were referred by <strong id="refName"></strong>. Submit your details — you will be redirected to the provider's page after submission.</p>
      <form id="leadForm">
        <div class="field"><label>Full name</label><input id="cname" required /></div>
        <div class="field"><label>Email</label><input id="cemail" type="email" required /></div>
        <div class="field"><label>Phone</label><input id="cphone" inputmode="numeric" required /></div>
        <div class="field"><label>City</label><input id="ccity" /></div>
        <div style="margin-top:12px"><button class="btn" type="submit">Submit & Continue</button></div>
      </form>
      <div id="msg" class="small" style="margin-top:12px"></div>
    </div>
  </main>

<script>
const USERS_KEY='avsk_users', PRODUCTS_KEY='avsk_products';
const $=s=>document.querySelector(s);
function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}

const params = new URLSearchParams(location.search);
const ref = params.get('ref');
const productId = params.get('product');
const users = read(USERS_KEY, {});
const products = read(PRODUCTS_KEY, []);

if(!ref || !productId){ $('#card').innerHTML = '<h3>Invalid referral link</h3><p class="small">The link is incomplete.</p>'; throw new Error('invalid'); }
const product = products.find(p=>p.id === productId);
if(!product){ $('#card').innerHTML = '<h3>Unknown product</h3><p class="small">The product is not available.</p>'; throw new Error('unknown product'); }
const refEmail = Object.keys(users).find(e => users[e].referralCode === ref);
if(!refEmail){ $('#card').innerHTML = '<h3>Unknown referrer</h3><p class="small">The partner was not found.</p>'; throw new Error('unknown referrer'); }
const refUser = users[refEmail];
$('#productName').textContent = product.name; $('#productComm').textContent = product.commissionLabel || ('₹'+Number(product.commission||0)); $('#refName').textContent = refUser.name || refUser.email;

// anonymous click
refUser.clicks = (refUser.clicks||0) + 1; users[refEmail] = refUser; save(USERS_KEY, users);

$('#leadForm').addEventListener('submit', (e)=>{ e.preventDefault(); const name = $('#cname').value.trim(); const email = $('#cemail').value.trim().toLowerCase(); const phone = $('#cphone').value.trim(); const city = $('#ccity').value.trim(); if(!name || !email || !phone){ $('#msg').textContent='Please fill name, email and phone.'; return; } const lead = { id: crypto.randomUUID(), name, email, phone, city, productId, productName: product.name, createdAt: Date.now(), status: 'pending', referrer: refEmail };

const us = read(USERS_KEY, {});
us[refEmail].leads = (us[refEmail].leads||0) + 1; us[refEmail].leadsList = us[refEmail].leadsList||[]; us[refEmail].leadsList.push(lead);
us[refEmail].transactions = us[refEmail].transactions||[]; us[refEmail].transactions.push({ date: Date.now(), amount: 0, description: 'Lead: '+product.name, meta: { leadId: lead.id } });
save(USERS_KEY, us);
$('#msg').textContent = 'Thank you — redirecting to provider…'; setTimeout(()=>{ try{ location.href = product.url } catch { location.href = 'auth.html' } }, 800);
});
</script>
</body>
</html>
