<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVSK — Partner Dashboard</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-50 text-slate-800"><div id="impBanner" class="hidden bg-amber-100 text-amber-900 p-3 text-center text-sm">Admin preview mode: viewing <b id="impName"></b>. <button id="exitPreview" class="underline font-semibold">Exit preview</button></div><header class="bg-white border-b"><div class="max-w-6xl mx-auto flex items-center justify-between p-4"><div class="text-xl font-bold text-blue-600">AVSK Portal</div><div class="flex gap-2"><button id="backAdmin" class="hidden px-3 py-2 rounded bg-slate-800 text-white text-sm">Back to admin</button><a href="index.html" class="px-3 py-2 rounded bg-blue-50 text-blue-700 text-sm">Home</a><button id="logout" class="px-3 py-2 rounded bg-red-500 text-white text-sm">Logout</button></div></div></header><main class="max-w-6xl mx-auto p-4"><h1 id="welcome" class="text-2xl font-semibold">Welcome</h1><p class="text-sm text-slate-500">Partner workspace</p><div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-5"><div class="bg-white p-4 rounded shadow"><span class="text-sm text-slate-500">Wallet</span><div id="balance" class="text-2xl font-bold text-green-600 mt-2">₹0</div></div><div class="bg-white p-4 rounded shadow"><span class="text-sm text-slate-500">Clicks</span><div id="clicks" class="text-2xl font-bold mt-2">0</div></div><div class="bg-white p-4 rounded shadow"><span class="text-sm text-slate-500">Leads</span><div id="leads" class="text-2xl font-bold mt-2">0</div></div></div><section class="mt-6"><h2 class="text-lg font-semibold mb-2">Products & referral links</h2><div id="productsGrid" class="grid md:grid-cols-2 gap-4"></div></section><section class="mt-6"><h2 class="text-lg font-semibold mb-2">My Profile & KYC</h2><div class="bg-white p-4 rounded shadow grid md:grid-cols-2 gap-3"><label>Full name<input id="p_name" class="w-full p-2 border rounded mt-1"></label><label>Email<input id="p_email" disabled class="w-full p-2 border rounded mt-1 bg-slate-50"></label><label>UPI<input id="p_upi" class="w-full p-2 border rounded mt-1"></label><label>Bank name<input id="p_bank" class="w-full p-2 border rounded mt-1"></label><label>IFSC<input id="p_ifsc" class="w-full p-2 border rounded mt-1"></label><label>Account<input id="p_account" class="w-full p-2 border rounded mt-1"></label><label>PAN<input id="p_pan" class="w-full p-2 border rounded mt-1"></label><label>Aadhaar last 4<input id="p_aadhaar" maxlength="4" class="w-full p-2 border rounded mt-1"></label><div class="md:col-span-2"><button id="saveProfile" class="bg-blue-600 text-white px-4 py-2 rounded">Save profile</button><span id="profileMsg" class="text-sm text-green-600 ml-3"></span></div></div></section><section class="mt-6"><h2 class="text-lg font-semibold mb-2">Transactions</h2><div class="bg-white p-4 rounded shadow overflow-auto"><table class="w-full text-sm"><tbody id="txBody"></tbody></table></div></section></main>
<script>
const U='avsk_users',S='avsk_session',P='avsk_products',IMP='avsk_impersonation',$=s=>document.querySelector(s);function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function money(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(Number(n)||0)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const session=read(S,null),users=read(U,{}),imp=read(IMP,null);let adminView=imp&&users[imp.targetEmail]&&users[session?.email]?.role==='admin';let user=adminView?users[imp.targetEmail]:session&&users[session.email];if(!user||(!adminView&&user.role!=='partner')){location.replace('auth.html')}else{function render(){user=read(U,{})[adminView?imp.targetEmail:session.email];$('#welcome').textContent=(adminView?'Admin preview — ':'Welcome, ')+(user.name||user.email);$('#balance').textContent=money(user.balance);$('#clicks').textContent=user.clicks||0;$('#leads').textContent=user.leads||0;$('#p_name').value=user.name||'';$('#p_email').value=user.email;$('#p_upi').value=user.profile?.upi||'';$('#p_bank').value=user.profile?.bankName||'';$('#p_ifsc').value=user.profile?.ifsc||'';$('#p_account').value=user.profile?.bankAccount||'';$('#p_pan').value=user.kyc?.pan||'';$('#p_aadhaar').value=user.kyc?.aadharLast4||'';let base=location.href.split('#')[0].replace('dashboard.html',''),ps=read(P,[]);$('#productsGrid').innerHTML=ps.map((p,i)=>{let link=base+'referral.html?ref='+encodeURIComponent(user.referralCode)+'&product='+encodeURIComponent(p.id);return `<div class="bg-white p-4 rounded shadow"><b>${esc(p.name)}</b><div class="text-sm text-slate-500">${esc(p.commissionLabel||money(p.commission))}</div><div class="flex gap-2 mt-2"><input readonly id="l${i}" value="${esc(link)}" class="flex-1 p-2 border rounded text-xs"><button class="bg-blue-600 text-white px-2 rounded" data-copy="l${i}">Copy</button></div></div>`}).join('')||'<p class="text-slate-500">No products.</p>';let tx=(user.transactions||[]).slice(-20).reverse();$('#txBody').innerHTML=tx.length?'<tr><th class="text-left p-2">Date</th><th class="text-left p-2">Description</th><th class="text-left p-2">Amount</th></tr>'+tx.map(t=>`<tr><td class="p-2">${new Date(t.date).toLocaleString()}</td><td class="p-2">${esc(t.description)}</td><td class="p-2">${money(t.amount)}</td></tr>`).join(''):'<tr><td class="p-2">No transactions.</td></tr>'}$('#productsGrid').onclick=e=>{let b=e.target.closest('[data-copy]');if(b){navigator.clipboard?.writeText($('#'+b.dataset.copy).value);b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1000)}};if(adminView){$('#impBanner').classList.remove('hidden');$('#impName').textContent=user.email;$('#backAdmin').classList.remove('hidden');$('#logout').classList.add('hidden');$('#backAdmin').onclick=()=>{localStorage.removeItem(IMP);location.href='admin.html'};$('#exitPreview').onclick=()=>{localStorage.removeItem(IMP);location.href='admin.html'}}$('#saveProfile').onclick=()=>{if(!adminView){let us=read(U,{}),u=us[session.email];u.name=$('#p_name').value.trim()||u.name;u.profile={...(u.profile||{}),upi:$('#p_upi').value.trim(),bankName:$('#p_bank').value.trim(),ifsc:$('#p_ifsc').value.trim(),bankAccount:$('#p_account').value.trim()};u.kyc={...(u.kyc||{}),pan:$('#p_pan').value.trim().toUpperCase(),aadharLast4:$('#p_aadhaar').value.trim(),status:'pending',verified:false};us[session.email]=u;save(U,us);$('#profileMsg').textContent='Profile saved.';render()}else $('#profileMsg').textContent='Preview mode is read-only.'};$('#logout').onclick=()=>{localStorage.removeItem(S);location.href='auth.html'};render();addEventListener('storage',e=>{if([U,P,IMP].includes(e.key))location.reload()})}
</script></body></html>
