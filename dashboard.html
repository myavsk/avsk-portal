<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVSK | Partner dashboard</title><style>
:root{--p:#2563eb;--ink:#0f172a;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:var(--ink);font:15px system-ui,sans-serif}header{background:#fff;border-bottom:1px solid #e2e8f0}.wrap{max-width:1150px;margin:auto;padding:0 20px}.nav{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:22px;color:var(--p)}.nav a,.btn{padding:10px 14px;border-radius:9px;border:0;background:var(--p);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}.nav .home{background:#eff6ff;color:var(--p);margin-right:8px}.main{padding:35px 20px}.welcome{margin-bottom:25px}.welcome h1{margin:0;font-size:31px}.muted{color:var(--muted)}.stats,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:17px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:20px;box-shadow:0 4px 15px #0f172a08}.stat{font-size:30px;font-weight:800;margin-top:10px}.green{color:#16a34a}.products{margin-top:35px}.product{display:flex;flex-direction:column;gap:12px}.product h3{margin:0}.copyrow{display:flex;gap:7px}.copyrow input{min-width:0;flex:1;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:12px}.copyrow button{width:auto;margin:0}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 7px;text-align:left;border-bottom:1px solid #e2e8f0}.scroll{overflow:auto}
</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">AVSK Portal</a><div><a class="home" href="index.html">Home</a><button class="btn" id="logout">Logout</button></div></div></header><main class="wrap main"><section class="welcome"><h1 id="welcome">Welcome</h1><p class="muted">Your partner workspace — share responsibly and track your growth.</p></section><section class="stats"><div class="card"><span class="muted">Wallet balance</span><div class="stat green" id="balance">₹0</div></div><div class="card"><span class="muted">Referral clicks</span><div class="stat" id="clicks">0</div></div><div class="card"><span class="muted">Converted leads</span><div class="stat" id="leads">0</div></div></section><section class="products"><h2>Referral products</h2><div id="grid" class="grid"></div></section><section class="products"><h2>Recent transactions</h2><div class="card scroll"><table class="table"><thead><tr><th>Date</th><th>Description</th><th>Amount</th></tr></thead><tbody id="tx"><tr><td colspan="3" class="muted">No transactions yet.</td></tr></tbody></table></div></section></main><script>
const U='avsk_users',S='avsk_session',P='avsk_products';const $=x=>document.querySelector(x);function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function money(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(Number(n)||0)}function auth(){let s=read(S,null),u=s&&read(U,{})[s.email];if(!s||!u||u.role!=='partner'){location.replace('auth.html');return null}return u}let user=auth();if(user){$('#welcome').textContent='Welcome, '+user.name+' 👋';function render(){user=auth();if(!user)return;$('#balance').textContent=money(user.balance);$('#clicks').textContent=user.clicks||0;$('#leads').textContent=user.leads||0;let ps=read(P,[]),base=location.href.replace('dashboard.html',''),g=$('#grid');g.innerHTML=ps.length?ps.map((p,i)=>{let link=base+'auth.html?ref='+encodeURIComponent(user.referralCode)+'&product='+encodeURIComponent(p.id);return `<article class="card product"><h3>${esc(p.name)}</h3><span class="muted">Commission: <b>${esc(p.commissionLabel||money(p.commission))}</b></span><div class="copyrow"><input readonly value="${esc(link)}" id="l${i}"><button class="btn" data-copy="l${i}">Copy</button></div></article>`}).join(''):'<p class="muted">No products are currently available.</p>';let rows=(user.transactions||[]).slice(-10).reverse();$('#tx').innerHTML=rows.length?rows.map(t=>`<tr><td>${new Date(t.date).toLocaleDateString('en-IN')}</td><td>${esc(t.description)}</td><td class="green">${money(t.amount)}</td></tr>`).join(''):'<tr><td colspan="3" class="muted">No transactions yet.</td></tr>'}$('#grid').onclick=e=>{let b=e.target.closest('[data-copy]');if(b){navigator.clipboard?.writeText($('#'+b.dataset.copy).value);b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1000)}};$('#logout').onclick=()=>{localStorage.removeItem(S);location.href='auth.html'};render();addEventListener('storage',e=>{if([U,P].includes(e.key))render()})}
</script></body></html>
