<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Dashboard - AVSK Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">AVSK Partner Dashboard</h1>
            <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-red-600 transition">Logout</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-10">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 mb-8">
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Welcome, Partner! 👋</h2>
            <p class="text-slate-600">Here is your unique referral link to promote financial products and earn commissions.</p>
        </div>

        <div class="grid md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <h3 class="text-lg font-bold text-slate-800 mb-4">🔗 Your Referral Link</h3>
                <div class="flex gap-2">
                    <input type="text" id="ref-link" readonly class="w-full px-3 py-2 border rounded-lg bg-slate-50 text-slate-600 text-sm" value="https://myavsk.github.io/avsk-portal/auth.html?ref=AVSK99">
                    <button onclick="copyLink()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">Copy</button>
                </div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <h3 class="text-lg font-bold text-slate-800 mb-4">📊 Quick Stats</h3>
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div class="bg-blue-50 p-4 rounded-lg">
                        <p class="text-slate-500 text-sm">Total Clicks</p>
                        <p class="text-2xl font-bold text-blue-600">12</p>
                    </div>
                    <div class="bg-green-50 p-4 rounded-lg">
                        <p class="text-slate-500 text-sm">Total Earnings</p>
                        <p class="text-2xl font-bold text-green-600">₹0.00</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        if(localStorage.getItem('avsk_logged_in') !== 'true') {
            window.location.href = 'auth.html';
        }

        function copyLink() {
            const link = document.getElementById('ref-link');
            link.select();
            navigator.clipboard.writeText(link.value);
            alert('Referral link copied to clipboard!');
        }

        function logout() {
            localStorage.removeItem('avsk_logged_in');
            window.location.href = 'auth.html';
        }
    </script>
</body>
</html>
