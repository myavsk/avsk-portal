version: '3.9'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_ACCESS_SECRET: change_this_in_production
      JWT_REFRESH_SECRET: change_this_in_production
      ADMIN_EMAIL: admin@avsk.com
      ADMIN_PASSWORD: Admin@12345
      DB_PATH: /app/data/avsk.db
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
