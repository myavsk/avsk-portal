<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVSK | Secure access</title><style>
:root{--p:#2563eb;--ink:#0f172a;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eff6ff,#f8fafc);color:var(--ink);font:15px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(460px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:32px;box-shadow:0 15px 50px #1e3a8a18}.brand{font-size:25px;font-weight:800;color:var(--p);text-align:center;margin-bottom:8px}.sub{text-align:center;color:var(--muted);margin-bottom:25px}label{display:block;font-weight:700;margin:15px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}button,.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--p);color:#fff;font-weight:700;cursor:pointer;width:100%;margin-top:20px}.switch{background:#eff6ff;color:var(--p);margin-top:10px}.msg{margin-top:15px;text-align:center;min-height:20px;color:#b91c1c}.ok{color:#15803d}.back{display:block;text-align:center;color:var(--muted);margin-top:20px}
</style></head><body><main class="box"><div class="brand">AVSK Portal</div><div class="sub" id="subtitle">Secure partner access</div><form id="form"><div id="nameWrap" style="display:none"><label>Full name</label><input id="name" autocomplete="name"></div><label>Email address</label><input id="email" type="email" required autocomplete="email"><label>Password</label><input id="password" type="password" required minlength="8" autocomplete="current-password"><div id="confirmWrap" style="display:none"><label>Confirm password</label><input id="confirm" type="password" minlength="8"></div><button id="submit">Sign in</button></form><button class="switch" id="switch">Create partner account</button><div class="msg" id="msg" role="alert"></div><a class="back" href="index.html">← Back to home</a></main><script>
const U='avsk_users',S='avsk_session';let register=false;const $=x=>document.querySelector(x);function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function hex(a){return [...new Uint8Array(a)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function digest(text){return hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)))}async function hash(p,s){let k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(s),iterations:120000,hash:'SHA-256'},k,256))}function salt(){let a=new Uint8Array(16);crypto.getRandomValues(a);return hex(a)}function token(){let a=new Uint8Array(24);crypto.getRandomValues(a);return hex(a)}function setMode(){register=!register;$('#nameWrap').style.display=register?'block':'none';$('#confirmWrap').style.display=register?'block':'none';$('#submit').textContent=register?'Create account':'Sign in';$('#switch').textContent=register?'Already have an account? Sign in':'Create partner account';$('#subtitle').textContent=register?'Join the AVSK partner network':'Secure partner access';$('#msg').textContent=''}$('#switch').onclick=setMode;
$('#form').onsubmit=async e=>{e.preventDefault();let email=$('#email').value.trim().toLowerCase(),pw=$('#password').value,users=read(U,{});if(!email||pw.length<8)return $('#msg').textContent='Use a valid email and an 8+ character password.';if(register){let name=$('#name').value.trim();if(!name||pw!==$('#confirm').value)return $('#msg').textContent='Enter your name and matching passwords.';if(users[email])return $('#msg').textContent='An account with this email already exists.';let s=salt();users[email]={email,name,salt:s,hash:await hash(pw,s),role:'partner',balance:0,referralCode:(await digest(email)).slice(0,12),clicks:0,leads:0,transactions:[],createdAt:Date.now()};save(U,users);$('#msg').className='msg ok';$('#msg').textContent='Account created. Signing you in…'}else{let u=users[email];if(!u||!(await hash(pw,u.salt)).localeCompare(u.hash))return $('#msg').textContent='Invalid email or password.';localStorage.setItem(S,JSON.stringify({email,token:token(),issued:Date.now()}));location.href=u.role==='admin'?'admin.html':'dashboard.html';return}if(register){localStorage.setItem(S,JSON.stringify({email,token:token(),issued:Date.now()}));setTimeout(()=>location.href='dashboard.html',400)}};
(function(){let q=new URLSearchParams(location.search),r=q.get('ref');if(r)localStorage.setItem('avsk_pending_ref',r);let s=read(S,null),u=s&&read(U,{})[s.email];if(u)location.href=u.role==='admin'?'admin.html':'dashboard.html'})();
</script></body></html>
