<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - AVSK Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 id="form-title" class="text-2xl font-bold text-center text-slate-800 mb-6">Partner Login</h2>
        
        <!-- Form -->
        <form id="auth-form" onsubmit="handleAuth(event)">
            <div id="name-field" class="mb-4 hidden">
                <label class="block text-slate-700 text-sm font-semibold mb-2">Full Name</label>
                <input type="text" id="fullname" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your name">
            </div>
            <div class="mb-4">
                <label class="block text-slate-700 text-sm font-semibold mb-2">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your email">
            </div>
            <div class="mb-6">
                <label class="block text-slate-700 text-sm font-semibold mb-2">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter password">
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">Login</button>
        </form>

        <p class="text-center text-sm text-slate-600 mt-4">
            <span id="toggle-text">Don't have an account?</span> 
            <button onclick="toggleMode()" class="text-blue-600 font-semibold hover:underline">Register here</button>
        </p>
        <p class="text-center mt-2"><a href="index.html" class="text-slate-500 text-sm hover:underline">← Back to Home</a></p>
    </div>

    <script>
        let isLogin = true;
        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('form-title').innerText = isLogin ? "Partner Login" : "Partner Registration";
            document.getElementById('submit-btn').innerText = isLogin ? "Login" : "Register";
            document.getElementById('name-field').classList.toggle('hidden', isLogin);
            document.getElementById('toggle-text').innerText = isLogin ? "Don't have an account?" : "Already have an account?";
        }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(!isLogin) {
                const name = document.getElementById('fullname').value;
                localStorage.setItem('avsk_user', JSON.stringify({ name, email }));
                alert('Registration successful! Please login.');
                toggleMode();
            } else {
                localStorage.setItem('avsk_logged_in', 'true');
                alert('Login successful!');
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
