<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AVSK Portal — Login / Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <div class="w-full max-w-xl bg-white rounded-xl shadow p-6">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-bold text-slate-800">AVSK Portal</h1>
      <button id="toggleMode" class="text-sm text-blue-600">Create account</button>
    </div>

    <form id="authForm" class="space-y-3">
      <div id="nameWrap" class="hidden">
        <label class="text-sm font-semibold">Full name</label>
        <input id="name" class="w-full mt-1 p-2 border rounded" />
      </div>

      <div id="kycWrap" class="grid grid-cols-2 gap-2 hidden">
        <div>
          <label class="text-sm font-semibold">Aadhaar (last 4)</label>
          <input id="aadhar" maxlength="4" class="w-full mt-1 p-2 border rounded" placeholder="1234" />
        </div>
        <div>
          <label class="text-sm font-semibold">PAN</label>
          <input id="pan" maxlength="10" class="w-full mt-1 p-2 border rounded" placeholder="ABCDE1234F" />
        </div>
      </div>

      <div id="bankWrap" class="grid grid-cols-2 gap-2 hidden">
        <div>
          <label class="text-sm font-semibold">Bank name</label>
          <input id="bankName" class="w-full mt-1 p-2 border rounded" placeholder="State Bank" />
        </div>
        <div>
          <label class="text-sm font-semibold">IFSC</label>
          <input id="ifsc" class="w-full mt-1 p-2 border rounded" placeholder="SBIN0001234" />
        </div>
      </div>

      <div id="accWrap" class="hidden">
        <label class="text-sm font-semibold">Bank account number</label>
        <input id="bankAccount" class="w-full mt-1 p-2 border rounded" />
      </div>

      <div>
        <label class="text-sm font-semibold">Email</label>
        <input id="email" type="email" required class="w-full mt-1 p-2 border rounded" />
      </div>

      <div>
        <label class="text-sm font-semibold">Password</label>
        <input id="password" type="password" required minlength="6" class="w-full mt-1 p-2 border rounded" />
      </div>

      <div id="confirmWrap" class="hidden">
        <label class="text-sm font-semibold">Confirm password</label>
        <input id="confirm" type="password" minlength="6" class="w-full mt-1 p-2 border rounded" />
      </div>

      <div class="flex gap-2">
        <button id="submitBtn" class="flex-1 bg-blue-600 text-white p-2 rounded font-semibold">Sign in</button>
        <a href="index.html" class="p-2 rounded border text-sm flex items-center justify-center">Home</a>
      </div>

      <p id="msg" class="text-sm text-red-600 min-h-[1.25rem]"></p>
      <p class="text-xs text-slate-500">Partners must register to create referral links. Admins are set separately.</p>
    </form>
  </div>

<script>
/*
Frontend-only auth using localStorage.
Data model:
- avsk_users: { [email]: { name, email, password, role, balance, referralCode, profile, kyc, transactions, leadsList, clicks, leads } }
- avsk_session: { email, token, issued }
This is demo-only. LocalStorage can be modified by users.
*/
const USERS_KEY = 'avsk_users';
const SESSION_KEY = 'avsk_session';

const $ = sel => document.querySelector(sel);
let registerMode = false;

function read(k, def){ try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch(e){ return def; } }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
function randToken(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }

$('#toggleMode').addEventListener('click', ()=> {
  registerMode = !registerMode;
  $('#nameWrap').classList.toggle('hidden', !registerMode);
  $('#confirmWrap').classList.toggle('hidden', !registerMode);
  $('#kycWrap').classList.toggle('hidden', !registerMode);
  $('#bankWrap').classList.toggle('hidden', !registerMode);
  $('#accWrap').classList.toggle('hidden', !registerMode);
  $('#submitBtn').textContent = registerMode ? 'Create account' : 'Sign in';
  $('#toggleMode').textContent = registerMode ? 'Have an account? Sign in' : 'Create account';
  $('#msg').textContent = '';
});

$('#authForm').addEventListener('submit', (e) => {
  e.preventDefault();
  $('#msg').textContent = '';
  const email = $('#email').value.trim().toLowerCase();
  const password = $('#password').value;
  if(!email || password.length < 6){ $('#msg').textContent = 'Enter valid email & password (6+ chars).'; return; }
  const users = read(USERS_KEY, {});
  if(registerMode){
    const name = $('#name').value.trim();
    if(!name){ $('#msg').textContent = 'Please enter full name.'; return; }
    if(password !== $('#confirm').value){ $('#msg').textContent = 'Passwords do not match.'; return; }
    if(users[email]){ $('#msg').textContent = 'Account exists. Please login.'; return; }
    const referralCode = 'REF' + Math.random().toString(36).slice(2,10).toUpperCase();
    users[email] = {
      email, name, password, role: 'partner',
      balance: 0, referralCode, clicks:0, leads:0, leadsList: [], transactions: [],
      profile: { upi:'', bankName:'', ifsc:'', bankAccount:'' },
      kyc: { aadharLast4: $('#aadhar').value.trim(), pan: $('#pan').value.trim().toUpperCase(), documents: {}, status: 'pending', verified: false }
    };
    save(USERS_KEY, users);
    save(SESSION_KEY, { email, token: randToken(), issued: Date.now() });
    window.location.href = 'dashboard.html';
    return;
  } else {
    const user = users[email];
    if(!user || user.password !== password){ $('#msg').textContent = 'Invalid credentials.'; return; }
    save(SESSION_KEY, { email, token: randToken(), issued: Date.now() });
    // send admin to admin.html only if they are admin? keep behavior: redirect according to role
    window.location.href = user.role === 'admin' ? 'admin.html' : 'dashboard.html';
  }
});

// auto-redirect if session exists
(function(){
  const s = read(SESSION_KEY, null);
  const users = read(USERS_KEY, {});
  if(s && users[s.email]) {
    window.location.href = users[s.email].role === 'admin' ? 'admin.html' : 'dashboard.html';
  }
})();
</script>
</body>
</html>
